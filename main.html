<!DOCTYPE html>
<html lang="en">
<head>
  

  <style>
    body {
      font-family: Arial, sans-serif;
    }

    #openModal {
      padding: 10px 20px;
      cursor: pointer;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
    }

    .modal:target {
      display: block;
    }

    .modal-content {
      width: 400px;
      background: white;
      margin: 100px auto;
      border-radius: 8px;
      overflow: hidden;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      background: #f1f1f1;
    }

    .modal-body {
      padding: 20px;
    }

    .close-modal {
      text-decoration: none;
      font-size: 22px;
      color: black;
    }
  </style>
</head>
<body>

  <a href="#modal" id="openModal">Open Modal</a>

  <div class="modal" id="modal">
    <a href="#" class="modal"></a>

    <div class="modal-content">

      <div class="modal-header">
        <h2>Modal Header</h2>
        <a href="#" class="close-modal">&times;</a>
      </div>

      <div class="modal-body">
        <p>Modal Body Content</p>
      </div>

    </div>
  </div>

</body>
</html>
